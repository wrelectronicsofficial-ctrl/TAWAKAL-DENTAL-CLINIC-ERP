<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tawakal Dental Clinic ERP</title>
    <script>
      (function () {
        var pathSegments = window.location.pathname.split('/').filter(Boolean);
        var isProjectSite = window.location.hostname.endsWith('.github.io') && pathSegments.length > 0;
        var base = isProjectSite ? '/' + pathSegments[0] + '/' : '/';
        window.location.replace(base + window.location.search + window.location.hash);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to Tawakal Dental Clinic ERP...</p>
  </body>
</html>
